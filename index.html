<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Demo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87b8e8; touch-action: none; }
      canvas { display: block; touch-action: none; }
      #hud {
        position: fixed; left: 16px; top: 14px; z-index: 10;
        color: #fff; font: 13px/1.6 -apple-system, "PingFang SC", sans-serif;
        text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none;
      }
      #hud b { font-size: 15px; }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #fff; font: 16px sans-serif; background: #87b8e8; z-index: 20;
      }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%; background: rgba(255,255,255,.5); z-index: 5; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">正在加载世界…</div>
    <div id="crosshair"></div>
    <div id="hud">
      <b>开放世界 Demo（塞尔达式镜头相对）</b><br/>
      WASD / 摇杆：相对镜头移动 · 角色自动朝移动方向<br/>
      鼠标拖动转镜头 · Shift 奔跑 · Space 跳跃 · K/Ctrl 翻滚<br/>
      J 攻击 · 怪红圈前摇时可走位/翻滚躲开 · 跑远脱战<br/>
      手机：左摇杆 · 右半屏拖视角 · 右下 滚/跳/攻
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
